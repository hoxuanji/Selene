<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- crescent moon -->
    <circle cx="-10" cy="-20" r="110" fill="#fff" opacity="0.95"/>
    <circle cx="40" cy="-60" r="90" fill="url(#bg)"/>
    <!-- three stars -->
    <circle cx="80" cy="-90" r="8" fill="#fff"/>
    <circle cx="110" cy="-40" r="5" fill="#fff" opacity="0.8"/>
    <circle cx="60" cy="-120" r="4" fill="#fff" opacity="0.6"/>
  </g>
</svg>
