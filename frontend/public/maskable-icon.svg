<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
  </defs>
  <!-- maskable icons need full bleed background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- crescent moon – slightly smaller for safe zone -->
    <circle cx="-8" cy="-16" r="90" fill="#fff" opacity="0.95"/>
    <circle cx="32" cy="-48" r="72" fill="url(#bg)"/>
    <!-- three stars -->
    <circle cx="64" cy="-72" r="7" fill="#fff"/>
    <circle cx="88" cy="-32" r="4.5" fill="#fff" opacity="0.8"/>
    <circle cx="48" cy="-96" r="3.5" fill="#fff" opacity="0.6"/>
  </g>
</svg>
